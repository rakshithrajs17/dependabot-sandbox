name: probe

on: workflow_dispatch

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned with a version comment: expect SHA + comment to move to v7.
      - uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2 # v4.0.0
      # Tag-pinned: expect a minor update to v6.5.0.
      - uses: actions/setup-go@v6.0.0
        with:
          go-version: "1.26.10"
