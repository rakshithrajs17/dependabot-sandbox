name: reusable-self-syntax

on:
  workflow_call:
    inputs:
      label:
        description: Label passed by the caller
        required: false
        type: string
        default: reusable

permissions:
  contents: read

jobs:
  reusable-job:
    runs-on: ubuntu-latest
    steps:
      - name: Called-workflow context
        shell: bash
        env:
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          echo "github.workflow_ref=${GITHUB_WORKFLOW_REF}"
          echo "job.workflow_ref=${JOB_WORKFLOW_REF}"
          echo "job.workflow_sha=${JOB_WORKFLOW_SHA}"

      - name: Same-repo action from a called reusable workflow
        uses: $/.github/actions/echo-context
        with:
          label: ${{ inputs.label }}

      - name: Nested same-repo action from a called reusable workflow
        uses: $/.github/actions/nested
